[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-telemetry-data-pipeline"
version = "0.1.0"
description = "A production-grade ELT pipeline cross-referencing global flight vectors with localized airport air quality indicators."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Database :: Database Engines :: Connection Layer",
]

# Core pipeline execution dependencies
dependencies = [
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "pandas",
    "dbt-core>=1.11.11",
    "dbt-postgres>=1.9.0"
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["global_telemetry_data_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []