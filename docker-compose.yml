version: '3.8'

services:
  postgres_source:
    image: postgres:15-alpine
    container_name: postgres_source_container
    environment:
      POSTGRES_USER: telemetry_admin
      POSTGRES_PASSWORD: admin_secure_password_2026
      POSTGRES_DB: operational_telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: